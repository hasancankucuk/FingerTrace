name: Frontend & Package CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Rollup Package
        run: npm run build --workspace=../sdk/trace-sdk

      - name: Build Vite App
        run: npm run build --workspace=../frontend
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}

      - name: Run Tests
        run: npm test