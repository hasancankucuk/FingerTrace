name: Frontend & Package CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/trace-sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: ./sdk/trace-sdk
        run: npm ci

      - name: Build Rollup Package
        working-directory: ./sdk/trace-sdk
        run: npm run build

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite App
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test || echo "No tests found"