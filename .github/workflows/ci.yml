name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else echo "No backend/requirements.txt"; fi

      - name: Run backend tests (if present)
        run: |
          if [ -d backend/tests ]; then pytest -q; else echo "No backend tests"; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend deps
        working-directory: frontend/trace-ui
        run: npm ci

      - name: Build frontend
        working-directory: frontend/trace-ui
        run: npm run build --if-present

      - name: Install & build SDK
        working-directory: sdk/trace-sdk
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            frontend/trace-ui/dist
            frontend/trace-ui/build
            sdk/trace-sdk/dist

  docker-build-and-push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only attempt qemu/setup/buildx/login/push if secrets are provided.
      - name: Check for Docker secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "secrets_present=true" >> $GITHUB_OUTPUT
          else
            echo "secrets_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend image
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME }}/fingertrace-backend:latest

      - name: Build & push frontend image (optional)
        if: steps.check-secrets.outputs.secrets_present == 'true'
        uses: docker/build-push-action@v4
        with:
          context: frontend/trace-ui
          file: frontend/trace-ui/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/${{ secrets.DOCKER_USERNAME
