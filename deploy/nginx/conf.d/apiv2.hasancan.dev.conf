# CORS için hangi Origin'lere izin verileceğini belirleyen map.
# Tarayıcıdan gelen Origin header'ı bu listede varsa, $cors_origin değişkenine atanır.
map $http_origin $cors_origin {
    default "";
    "http://localhost:3000"      $http_origin;
    "https://fingertrace.app"      $http_origin;
    "https://www.fingertrace.app"  $http_origin;
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.fingertrace.app;

    # SSL sertifika bilgileri
    # SSL sertifika bilgileri
    ssl_certificate /etc/letsencrypt/live/api.fingertrace.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fingertrace.app/privkey.pem;
    
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }
    
    ### CHATBOT ENDPOINTS (DISABLED - Service Removed) ###
    # location = /ask-trace { proxy_pass http://fingertrace-bot:8000/ask-trace; }
    # location = /chat { proxy_pass http://fingertrace-bot:8000/chat; }
    # location = /reset-conversation { proxy_pass http://fingertrace-bot:8000/reset-conversation; }
    # location /analytics/ { proxy_pass http://fingertrace-bot:8000/analytics/; }
    # location = /health { proxy_pass http://fingertrace-bot:8000/health; }
    # location = /status { proxy_pass http://fingertrace-bot:8000/status; }
    # location /ab-test/ { proxy_pass http://fingertrace-bot:8000/ab-test/; }
    # location /dialogue-testing/ { proxy_pass http://fingertrace-bot:8000/dialogue-testing/; }
    # location /feedback/ { proxy_pass http://fingertrace-bot:8000/feedback/; }
    # location /journey/ { proxy_pass http://fingertrace-bot:8000/journey/; }
    # location = /executive-dashboard { proxy_pass http://fingertrace-bot:8000/executive-dashboard; }
    # location = /cross-platform-performance { proxy_pass http://fingertrace-bot:8000/cross-platform-performance; }

    ### BACKEND API ###
    location /api/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-JA3-Fingerprint" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-JA3-Fingerprint" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        # Native JA3 Fingerprinting
        # proxy_set_header X-JA3-Fingerprint $http_ssl_ja3_hash;
        # access_by_lua_block {
        #     local ja3 = require "resty.ja3"
        #     local fingerprint = ja3.get_ja3_hash()
        #     if fingerprint and fingerprint ~= "" then
        #         ngx.req.set_header("X-JA3", fingerprint)
        #     end
        # }
        
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}