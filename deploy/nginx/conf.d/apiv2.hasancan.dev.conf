# CORS için hangi Origin'lere izin verileceğini belirleyen map.
# Tarayıcıdan gelen Origin header'ı bu listede varsa, $cors_origin değişkenine atanır.
map $http_origin $cors_origin {
    default "";
    "http://localhost:3000"      $http_origin;
    "https://fingertrace.app"      $http_origin;
    "https://www.fingertrace.app"  $http_origin;
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.fingertrace.app;

    # SSL sertifika bilgileri
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }
    
    ### CHATBOT ENDPOINTS ###

    # Chat endpoints
    location = /ask-trace {
        proxy_pass http://fingertrace-bot:8000/ask-trace;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /chat {
        proxy_pass http://fingertrace-bot:8000/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /reset-conversation {
        proxy_pass http://fingertrace-bot:8000/reset-conversation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### ANALYTICS ENDPOINTS ###

    location /analytics/ {
        proxy_pass http://fingertrace-bot:8000/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### HEALTH ENDPOINTS ###

    location = /health {
        proxy_pass http://fingertrace-bot:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /status {
        proxy_pass http://fingertrace-bot:8000/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### A/B TESTING ENDPOINTS ###

    location /ab-test/ {
        proxy_pass http://fingertrace-bot:8000/ab-test/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### DIALOGUE TESTING ENDPOINTS ###

    location /dialogue-testing/ {
        proxy_pass http://fingertrace-bot:8000/dialogue-testing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### FEEDBACK ENDPOINTS ###

    location /feedback/ {
        proxy_pass http://fingertrace-bot:8000/feedback/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### JOURNEY ENDPOINTS ###

    location /journey/ {
        proxy_pass http://fingertrace-bot:8000/journey/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### DASHBOARD ENDPOINTS ###

    location = /executive-dashboard {
        proxy_pass http://fingertrace-bot:8000/executive-dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /cross-platform-performance {
        proxy_pass http://fingertrace-bot:8000/cross-platform-performance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ### BACKEND API ###
    location /api/ {
        # CORS headers (Allow Cloudflare Frontend)
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-JA3-Fingerprint" always;

        # Handle OPTIONS method for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-JA3-Fingerprint" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        # Native JA3 Fingerprinting
        # proxy_set_header X-JA3-Fingerprint $http_ssl_ja3_hash;
        # access_by_lua_block {
        #     local ja3 = require "resty.ja3"
        #     local fingerprint = ja3.get_ja3_hash()
        #     ngx.log(ngx.INFO, "JA3 Debug - UA: " .. (ngx.req.get_headers()["User-Agent"] or "none"))
        #     ngx.log(ngx.INFO, "JA3 Debug - IP: " .. (ngx.var.remote_addr or "none"))
        #     if fingerprint and fingerprint ~= "" then
        #         ngx.req.set_header("X-JA3", fingerprint)
        #         ngx.log(ngx.INFO, "JA3 Hash Set: " .. fingerprint)
        #     else
        #         ngx.log(ngx.WARN, "JA3 fingerprint is empty or nil")
        #     end
        # }
        
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend is hosted on Cloudflare, so we don't serve it here.
    # But we need to handle 404s or root nicely.
    location / {
        return 404;
    }
}