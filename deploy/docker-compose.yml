services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fingertrace-backend
    working_dir: /app/backend
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - PYTHONPATH=/app
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - DOPPLER_PROJECT=finger-trace-backend
      - DOPPLER_CONFIG=prd
    ports:
      - "5000:5000" # Flask 
    volumes:
      - ../backend:/app/backend
    entrypoint: ["/bin/sh", "-c", "chmod +x /app/backend/start.sh && exec /bin/sh /app/backend/start.sh"]

  frontend:
    image: node:lts-trixie-slim
    container_name: fingertrace-frontend
    working_dir: /frontend
    volumes:
      - ../frontend/trace-ui:/frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DOPPLER_TOKEN=${DOPPLER_TOKEN_FE}
      - DOPPLER_PROJECT=finger-trace-frontend
      - DOPPLER_CONFIG=prd
    command: >-
      sh -c "
      apt-get update && apt-get install -y curl gnupg &&
      curl -Ls https://cli.doppler.com/install.sh | sh &&
      echo 'Creating .env file with Doppler CLI...' &&
      rm -rf .env &&
      doppler secrets download --no-file --format env | grep -E '^(REACT_APP_|NODE_|VITE_)' > /tmp/env_temp &&
      mv /tmp/env_temp .env &&
      echo 'Environment file created:' && ls -la .env && cat .env &&
      rm -rf node_modules &&
      npm install &&
      npm run dev -- --host 0.0.0.0
      "