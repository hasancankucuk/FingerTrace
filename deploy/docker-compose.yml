version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fingertrace-backend
    working_dir: /app/backend
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - PYTHONPATH=/app
      - WEB_CONCURRENCY=2
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - DOPPLER_PROJECT=finger-trace-backend
      - DOPPLER_CONFIG=${MODE}
    expose:
      - "5000"
    volumes:
      - ../backend:/app/backend
    entrypoint: ["/bin/sh", "-c", "chmod +x /app/backend/start.sh && exec /bin/sh /app/backend/start.sh"]
    networks:
      - fingertrace-shared
    restart: always

  nginx:
    # build:
    #   context: ./nginx
    #   dockerfile: Dockerfile
    image: nginx:latest
    container_name: fingertrace-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # JA3 Lua script is removed as we use native module, but keeping dir mapping just in case
      # - /etc/letsencrypt/live/api.fingertrace.app/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - /etc/letsencrypt/live/api.fingertrace.app/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fingertrace-shared
    restart: always

networks:
  fingertrace-shared:
    external: false