version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fingertrace-backend
    working_dir: /app/backend
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - PYTHONPATH=/app
      - WEB_CONCURRENCY=2
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - DOPPLER_PROJECT=finger-trace-backend
      - DOPPLER_CONFIG=${MODE}
    expose:
      - "5000"
    volumes:
      - ../backend:/app/backend
    entrypoint: ["/bin/sh", "-c", "chmod +x /app/backend/start.sh && exec /bin/sh /app/backend/start.sh"]
    networks:
      - fingertrace-shared
    restart: always

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: fingertrace-caddy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fingertrace-shared
    restart: always

  redis:
    image: "redis:alpine"
    container_name: fingertrace-redis
    expose:
      - "6379"
    networks:
      - fingertrace-shared
    restart: always

networks:
  fingertrace-shared:
    external: false